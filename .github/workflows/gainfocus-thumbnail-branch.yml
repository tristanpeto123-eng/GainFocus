name: GainFocus thumbnail branch integration
on:
  push:
    branches:
      - feature/exercise-photo-thumbnails-20261017
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch to oversized HTML on runner
        run: |
          node --check exercise-photo-thumbnails.js
          node --check tools/integrate-exercise-thumbnails.cjs
          node tools/integrate-exercise-thumbnails.cjs
          git diff --check
      - name: Commit only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: activate exercise thumbnails on feature branch"
          git push origin HEAD:"${GITHUB_REF_NAME}"
