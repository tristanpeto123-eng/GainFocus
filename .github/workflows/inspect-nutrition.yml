name: Inspect current nutrition scanner
on:
  push:
    branches: [feature/nutrition-ocr-guidance-preprocess-barcode-portions-20261017]
    paths: [scripts/inspect_nutrition.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/inspect_nutrition.py
      - name: Commit inspection report to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nutrition_source_inspection.json
          git diff --cached --quiet && exit 0
          git commit -m "test: inspect existing nutrition OCR and submission handlers"
          git push origin HEAD:feature/nutrition-ocr-guidance-preprocess-barcode-portions-20261017
