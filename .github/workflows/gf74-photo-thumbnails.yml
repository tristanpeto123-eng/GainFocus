name: GF74 exercise thumbnails — development branch only

on:
  push:
    branches:
      - feature/workout-photo-thumbnails-20261017
    paths:
      - tools/apply-gf74-photo-thumbnails.mjs
      - .github/workflows/gf74-photo-thumbnails.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/feature/workout-photo-thumbnails-20261017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal index.html patch and run mapping assertions
        run: node tools/apply-gf74-photo-thumbnails.mjs
      - name: Commit only the tested HTML to this development branch
        run: |
          if git diff --quiet -- index.html; then
            echo "No HTML changes needed"
            exit 0
          fi
          git add -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: photographic workout thumbnails (GF74, 43 exercises)"
          git push origin HEAD:feature/workout-photo-thumbnails-20261017
