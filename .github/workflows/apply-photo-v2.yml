name: Stage approved GainFocus photo v2
on:
  push:
    branches: [feature/approved-photo-thumbnails-v2-20261017]
    paths:
      - '.github/workflows/apply-photo-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-photo-loader:
    if: github.ref == 'refs/heads/feature/approved-photo-thumbnails-v2-20261017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install existing approved photo resolver in app HTML
        run: |
          python3 apply_approved_photo_loader.py
          git diff --check
          grep -F '<script src="./exercise-photo-thumbnails-v2.js?v=2" defer></script>' index.html
      - name: Commit isolated HTML integration
        run: |
          if git diff --quiet -- index.html; then
            echo "Already integrated"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: activate owner-approved photo v2 loader in GainFocus index"
          git push origin HEAD:feature/approved-photo-thumbnails-v2-20261017
